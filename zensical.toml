[project]
site_name = "Ryo Yasumoto"
site_url = "https://yasumoto-dev.github.io/portfolio/"
site_author = "yasumoto-dev"
site_description = "自律移動ロボットの研究・開発記録"
repo_url = "https://github.com/yasumoto-dev/portfolio"
repo_name = "yasumoto-dev/portfolio"
extra_css = ["stylesheets/extra.css"]

nav = [
  { "自己紹介" = "index.md" },
  { "研究" = [
    { "つくばチャレンジ2026" = "tsukuba_2026.md" },
    { "自動運転AIチャレンジ" = "aichallenge.md" },
  ]},
  { "実績" = "achievements.md" },
]

[project.theme]
language = "ja"
features = [
  "navigation.tabs",
  "navigation.tabs.sticky",
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.top",
  "navigation.footer",
  "toc.follow",
]

[project.theme.font]
text = "IBM Plex Sans JP"
code = "DM Mono"

# ダーク（最初に表示）
[[project.theme.palette]]
scheme = "slate"
primary = "black"
accent = "deep-orange"
toggle.icon = "lucide/sun"
toggle.name = "ライトモードへ"

# ライト
[[project.theme.palette]]
scheme = "default"
primary = "white"
accent = "deep-orange"
toggle.icon = "lucide/moon"
toggle.name = "ダークモードへ"

[project.markdown_extensions.attr_list]
[project.markdown_extensions.md_in_html]
[project.markdown_extensions.admonition]
[project.markdown_extensions.pymdownx.details]
[project.markdown_extensions.pymdownx.superfences]
[project.markdown_extensions.pymdownx.emoji]

emoji_index = "zensical.extensions.emoji.twemoji"
emoji_generator = "zensical.extensions.emoji.to_svg"

